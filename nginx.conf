server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing (BrowserRouter) — any path that isn't a real static
    # file must fall back to index.html so the app can handle the route itself, otherwise a
    # hard refresh or a shared link to e.g. /matches/3 gets a raw nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
