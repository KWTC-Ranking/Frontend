# docker compose up -d --build
# Requires a .env file (see .env.example) with VITE_API_BASE_URL set to the backend's real,
# reachable-from-the-browser URL — it gets baked into the build, so changing it later means
# rebuilding: docker compose up -d --build.
services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in .env (the backend's public URL)}
    container_name: kwtc-ranking-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
    networks:
      - kwtc-ranking

networks:
  kwtc-ranking:
    # Shared with the backend and the deploy/ Caddy reverse proxy (in the Backend repo) so Caddy
    # can reach this container by name. Created once with `docker network create kwtc-ranking` —
    # see the Backend repo's deploy/README.md for the full EC2 runbook.
    external: true
